name: EasyResto CI (Dev Mode)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:

  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cek apakah folder src ada
        run: |
          if [ ! -d "src" ]; then
            echo "src/ belum ada, skip PHP lint"
            exit 0
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP
        run: |
          files=$(find src/ -name "*.php")
          if [ -z "$files" ]; then
            echo "Tidak ada file PHP, skip"
            exit 0
          fi

          error=0
          for file in $files; do
            out=$(php -l "$file" 2>&1)
            if echo "$out" | grep -qE "Parse error|Fatal error"; then
              echo "ERROR: $file"
              echo "$out"
              error=1
            else
              echo "OK: $file"
            fi
          done

          [ $error -eq 1 ] && exit 1


  security-audit:
    name: Security Basic Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Skip jika src belum ada
        run: |
          [ ! -d "src" ] && echo "skip security check" && exit 0

      - name: Cek MD5
        run: |
          grep -r "md5(" src/ || echo "OK: tidak ada MD5"

      - name: Cek SQL Injection sederhana
        run: |
          risky=$(grep -rn --include="*.php" \
          -E 'query\s*\(\s*"[^"]*\$_(GET|POST)' src/ || true)

          if [ -n "$risky" ]; then
            echo "WARNING SQL Injection risk:"
            echo "$risky"
          else
            echo "OK: tidak ditemukan pola SQL injection"
          fi


  structure-check:
    name: Struktur (Soft Check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cek folder src
        run: |
          if [ ! -d "src" ]; then
            echo "WARNING: src/ belum dibuat"
            exit 0
          fi

      - name: Cek file penting (tidak fail)
        run: |
          for f in \
          src/config.php src/login.php src/register.php
          do
            [ ! -f "$f" ] && echo "WARNING Missing $f" || echo "OK $f"
          done


  db-check:
    name: Database Check (Optional)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cek file SQL
        run: |
          SQL_FILE=$(find . -name "*.sql" | head -n 1)
          if [ -z "$SQL_FILE" ]; then
            echo "WARNING: file SQL belum ada"
            exit 0
          else
            echo "OK: ditemukan $SQL_FILE"
          fi


  report:
    name: Laporan CI
    runs-on: ubuntu-latest
    needs: [php-lint, security-audit, structure-check, db-check]
    if: always()

    steps:
      - name: Output hasil
        run: |
          echo "PHP Lint: ${{ needs.php-lint.result }}"
          echo "Security: ${{ needs.security-audit.result }}"
          echo "Structure: ${{ needs.structure-check.result }}"
          echo "Database: ${{ needs.db-check.result }}"