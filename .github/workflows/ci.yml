name: EasyResto CI Pipeline

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# ==============================================================
# JOB 1 — PHP SYNTAX CHECK
# ==============================================================
jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint semua file PHP
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1)
            if echo "$out" | grep -qE "Parse error|Fatal error"; then
              echo "$f → $out"
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(find src/ -name "*.php" -print0)
          [ $fail -eq 1 ] && { echo; echo "PHP syntax error ditemukan."; exit 1; }
          echo; echo "Semua file PHP lolos syntax check."

# ==============================================================
# JOB 2 — DATABASE & SCHEMA VALIDATION
# Import SQL, validasi struktur tabel, view, trigger
# ==============================================================
  db-validate:
    name: Database & Schema Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easyresto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Tunggu MySQL siap
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null && echo "✅ MySQL siap." && break
            echo "($i/30) Menunggu MySQL..."
            sleep 2
          done

      - name: Import easyresto.sql
        run: |
          SQL=$(find . -name "easyresto.sql" | grep -v ".git" | head -n 1)
          [ -z "$SQL" ] && { echo "easyresto.sql tidak ditemukan."; exit 1; }
          echo "Mengimport: $SQL"
          mysql -h 127.0.0.1 -uroot -proot < "$SQL"
          echo "Import berhasil."

      - name: Validasi tabel wajib
        run: |
          fail=0
          for tbl in users menu kategori_menu transaksi detail_transaksi; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW TABLES LIKE '$tbl';")
            [ -z "$res" ] && { echo "Tabel tidak ada: $tbl"; fail=1; } || echo "✅ $tbl"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi kolom tabel users
        run: |
          fail=0
          for col in id_user username password role nama phone_number profile_picture; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW COLUMNS FROM users LIKE '$col';")
            [ -z "$res" ] && { echo "users.$col tidak ada"; fail=1; } || echo "✅ users.$col"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi kolom tabel menu & kategori_menu
        run: |
          fail=0
          for col in id_menu nama_menu harga id_kategori foto; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW COLUMNS FROM menu LIKE '$col';")
            [ -z "$res" ] && { echo "menu.$col tidak ada"; fail=1; } || echo "✅ menu.$col"
          done
          for col in id_kategori nama_kategori; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW COLUMNS FROM kategori_menu LIKE '$col';")
            [ -z "$res" ] && { echo "kategori_menu.$col tidak ada"; fail=1; } || echo "✅ kategori_menu.$col"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi kolom tabel transaksi & detail_transaksi
        run: |
          fail=0
          for col in id_transaksi nama_pelanggan tanggal subtotal ppn service total; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW COLUMNS FROM transaksi LIKE '$col';")
            [ -z "$res" ] && { echo "transaksi.$col tidak ada"; fail=1; } || echo "✅ transaksi.$col"
          done
          for col in id_detail id_transaksi id_menu jumlah subtotal; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW COLUMNS FROM detail_transaksi LIKE '$col';")
            [ -z "$res" ] && { echo "detail_transaksi.$col tidak ada"; fail=1; } || echo "✅ detail_transaksi.$col"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi VIEW laporan_penjualan & kolomnya
        run: |
          res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SELECT COUNT(*) FROM laporan_penjualan;" 2>&1)
          echo "$res" | grep -q "ERROR" && { echo "VIEW error: $res"; exit 1; }
          echo "VIEW laporan_penjualan OK — $res baris."

          fail=0
          for col in id_transaksi nama_pelanggan tanggal nama_menu nama_kategori jumlah subtotal ppn service total_permenu; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
              -se "SELECT $col FROM laporan_penjualan LIMIT 1;" 2>&1)
            echo "$res" | grep -q "ERROR" && { echo "VIEW.$col error"; fail=1; } || echo "✅ VIEW.$col"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi TRIGGER trg_subtotal_insert
        run: |
          res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SHOW TRIGGERS LIKE 'trg_subtotal_insert';")
          [ -z "$res" ] && { echo "TRIGGER trg_subtotal_insert tidak ditemukan."; exit 1; }
          echo "TRIGGER trg_subtotal_insert ada."

      - name: Validasi ENUM role (admin, owner, kasir)
        run: |
          res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SELECT COLUMN_TYPE FROM information_schema.COLUMNS
                 WHERE TABLE_SCHEMA='easyresto' AND TABLE_NAME='users' AND COLUMN_NAME='role';")
          echo "$res" | grep -qE "admin" && echo "$res" | grep -qE "owner" && echo "$res" | grep -qE "kasir" \
            && echo "✅ ENUM role OK: $res" \
            || { echo "❌ ENUM role tidak lengkap: $res"; exit 1; }

      - name: Validasi FOREIGN KEY — tidak ada orphan data
        run: |
          orphan_dt=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SELECT COUNT(*) FROM detail_transaksi d LEFT JOIN transaksi t ON d.id_transaksi=t.id_transaksi WHERE t.id_transaksi IS NULL;")
          [ "$orphan_dt" -eq 0 ] && echo "✅ FK detail_transaksi → transaksi: valid." \
            || echo "⚠️  $orphan_dt baris orphan di detail_transaksi."

          orphan_menu=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SELECT COUNT(*) FROM detail_transaksi d LEFT JOIN menu m ON d.id_menu=m.id_menu WHERE m.id_menu IS NULL;")
          [ "$orphan_menu" -eq 0 ] && echo "✅ FK detail_transaksi → menu: valid." \
            || echo "⚠️  $orphan_menu baris orphan (menu dihapus)."

# ==============================================================
# JOB 3 — FUNCTIONAL TESTING
# Simulasi semua alur utama: auth, transaksi, CRUD, laporan
# ==============================================================
  functional-test:
    name: Functional Testing
    runs-on: ubuntu-latest
    needs: db-validate

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easyresto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Import easyresto.sql
        run: |
          SQL=$(find . -name "easyresto.sql" | grep -v ".git" | head -n 1)
          mysql -h 127.0.0.1 -uroot -proot < "$SQL"

      # ── AUTH-1: Login kasir valid ─────────────────────────────
      - name: "[AUTH-1] Login kasir valid (MD5 password)"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->set_charset('utf8mb4');
          \$un='ci_kasir_auth'; \$pw='testpass'; \$h=md5(\$pw);
          \$s=\$conn->prepare('INSERT INTO users (username,password,role,nama) VALUES (?,?,?,?)');
          \$s->bind_param('ssss',\$un,\$h,\$r='kasir',\$n='CI Kasir');
          \$s->execute();
          \$s=\$conn->prepare('SELECT * FROM users WHERE username=?');
          \$s->bind_param('s',\$un); \$s->execute();
          \$u=\$s->get_result()->fetch_assoc();
          if(!\$u){echo 'FAIL: user tidak ditemukan';exit(1);}
          \$ok=(md5(\$pw)==\$u['password']||\$pw==\$u['password']);
          if(!\$ok){echo 'FAIL: password tidak cocok';exit(1);}
          if(\$u['role']!=='kasir'){echo 'FAIL: role salah';exit(1);}
          echo 'PASS: login kasir → role='.\$u['role'];
          \$conn->query(\"DELETE FROM users WHERE username='ci_kasir_auth'\");
          "
          echo "✅ AUTH-1 passed."

      # ── AUTH-2: Login username tidak ada ─────────────────────
      - name: "[AUTH-2] Login username tidak ditemukan"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$un='user_tidak_ada_xyz';
          \$s=\$conn->prepare('SELECT * FROM users WHERE username=?');
          \$s->bind_param('s',\$un); \$s->execute();
          \$u=\$s->get_result()->fetch_assoc();
          if(\$u){echo 'FAIL: seharusnya tidak ditemukan';exit(1);}
          echo 'PASS: username tidak ada → login ditolak.';
          "
          echo "✅ AUTH-2 passed."

      # ── AUTH-3: Login password salah ─────────────────────────
      - name: "[AUTH-3] Login password salah ditolak"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$un='ci_wrongpass'; \$rp='benar123'; \$wp='salah456';
          \$s=\$conn->prepare('INSERT INTO users (username,password,role,nama) VALUES (?,?,?,?)');
          \$s->bind_param('ssss',\$un,\$h=md5(\$rp),\$r='kasir',\$n='CI WP'); \$s->execute();
          \$s=\$conn->prepare('SELECT * FROM users WHERE username=?');
          \$s->bind_param('s',\$un); \$s->execute();
          \$u=\$s->get_result()->fetch_assoc();
          \$ok=(md5(\$wp)==\$u['password']||\$wp==\$u['password']);
          if(\$ok){echo 'FAIL: seharusnya ditolak';exit(1);}
          echo 'PASS: password salah → login ditolak.';
          \$conn->query(\"DELETE FROM users WHERE username='ci_wrongpass'\");
          "
          echo "✅ AUTH-3 passed."

      # ── AUTH-4: Redirect berdasarkan role ────────────────────
      - name: "[AUTH-4] Redirect destination sesuai role"
        run: |
          php -r "
          \$roles = ['admin'=>'admin/dashboard.php','owner'=>'owner/dashboard.php','kasir'=>'kasir/dashboard.php'];
          foreach(\$roles as \$role=>\$expected) {
            \$redirect = match(\$role) {
              'owner'  => 'owner/dashboard.php',
              'admin'  => 'admin/dashboard.php',
              'kasir'  => 'kasir/dashboard.php',
              default  => null
            };
            if(\$redirect !== \$expected){echo 'FAIL: redirect role '.\$role.' salah';exit(1);}
            echo 'PASS: role='.\$role.' → '.\$redirect;
            echo PHP_EOL;
          }
          "
          echo "✅ AUTH-4 passed."

      # ── REGISTER-1: Daftar kasir baru ────────────────────────
      - name: "[REGISTER-1] Registrasi kasir baru berhasil"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->set_charset('utf8mb4');
          \$nama='CI Kasir Baru'; \$un='ci_kasir_new'; \$pw='pass123'; \$phone='08123456789'; \$role='kasir';
          \$conn->query(\"DELETE FROM users WHERE username='ci_kasir_new'\");
          \$s=\$conn->prepare('INSERT INTO users (nama,username,password,phone_number,role) VALUES (?,?,?,?,?)');
          \$s->bind_param('sssss',\$nama,\$un,\$h=md5(\$pw),\$phone,\$role);
          if(!\$s->execute()){echo 'FAIL: '.\$conn->error;exit(1);}
          \$s=\$conn->prepare('SELECT * FROM users WHERE username=?');
          \$s->bind_param('s',\$un); \$s->execute();
          \$u=\$s->get_result()->fetch_assoc();
          if(!\$u){echo 'FAIL: user tidak tersimpan';exit(1);}
          if(\$u['role']!=='kasir'){echo 'FAIL: role bukan kasir';exit(1);}
          if(\$u['password']!==md5(\$pw)){echo 'FAIL: hash password salah';exit(1);}
          echo 'PASS: registrasi berhasil, role='.\$u['role'];
          \$conn->query(\"DELETE FROM users WHERE username='ci_kasir_new'\");
          "
          echo "✅ REGISTER-1 passed."

      # ── REGISTER-2: Username duplikat ────────────────────────
      - name: "[REGISTER-2] Username duplikat ditolak"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$un='ci_dup_user';
          \$conn->query(\"DELETE FROM users WHERE username='ci_dup_user'\");
          \$s=\$conn->prepare('INSERT INTO users (nama,username,password,role) VALUES (?,?,?,?)');
          \$s->bind_param('ssss',\$n='First',\$un,\$p=md5('x'),\$r='kasir'); \$s->execute();
          \$check=\$conn->prepare('SELECT id_user FROM users WHERE username=?');
          \$check->bind_param('s',\$un); \$check->execute();
          \$rows=\$check->get_result()->num_rows;
          if(\$rows===0){echo 'FAIL: user seharusnya sudah ada';exit(1);}
          echo 'PASS: duplikat terdeteksi ('.\$rows.' baris) → registrasi ditolak.';
          \$conn->query(\"DELETE FROM users WHERE username='ci_dup_user'\");
          "
          echo "✅ REGISTER-2 passed."

      # ── TRX-1: Kalkulasi PPN & service ───────────────────────
      - name: "[TRX-1] Kalkulasi subtotal, PPN 10%, service 2.5%"
        run: |
          php -r "
          // Simulasi logic proses_transaksi.php — cocokkan dengan transaksi id=1 di DB
          \$cart = [
            ['id'=>6, 'price'=>22000,'qty'=>1],
            ['id'=>10,'price'=>34000,'qty'=>1],
            ['id'=>16,'price'=>15000,'qty'=>1],
            ['id'=>15,'price'=>17000,'qty'=>1],
          ];
          \$subtotal=0;
          foreach(\$cart as \$i) \$subtotal+=\$i['price']*\$i['qty'];
          \$ppn=round(\$subtotal*0.10); \$service=round(\$subtotal*0.025);
          \$total=\$subtotal+\$ppn+\$service;
          \$exp=['subtotal'=>88000,'ppn'=>8800,'service'=>2200,'total'=>99000];
          if(\$subtotal!==\$exp['subtotal']){echo 'FAIL: subtotal '.\$subtotal.'!='.\$exp['subtotal'];exit(1);}
          if(\$ppn!==\$exp['ppn']){echo 'FAIL: ppn '.\$ppn.'!='.\$exp['ppn'];exit(1);}
          if(\$service!==\$exp['service']){echo 'FAIL: service '.\$service.'!='.\$exp['service'];exit(1);}
          if(\$total!==\$exp['total']){echo 'FAIL: total '.\$total.'!='.\$exp['total'];exit(1);}
          echo 'PASS: subtotal='.\$subtotal.', ppn='.\$ppn.', service='.\$service.', total='.\$total;
          "
          echo "✅ TRX-1 passed."

      # ── TRX-2: Insert transaksi + trigger subtotal ────────────
      - name: "[TRX-2] Insert transaksi ke DB + trigger subtotal otomatis"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->set_charset('utf8mb4');
          \$nama='CI_Test_TRX';
          \$cart=[['id'=>1,'price'=>25000,'qty'=>2],['id'=>11,'price'=>8000,'qty'=>1]];
          \$subtotal=0;
          foreach(\$cart as \$i) \$subtotal+=\$i['price']*\$i['qty'];
          \$ppn=round(\$subtotal*0.10); \$service=round(\$subtotal*0.025); \$total=\$subtotal+\$ppn+\$service;
          \$s=\$conn->prepare('INSERT INTO transaksi (nama_pelanggan,subtotal,ppn,service,total) VALUES (?,?,?,?,?)');
          \$s->bind_param('siiii',\$nama,\$subtotal,\$ppn,\$service,\$total);
          if(!\$s->execute()){echo 'FAIL: insert transaksi — '.\$conn->error;exit(1);}
          \$id=\$conn->insert_id;
          \$sd=\$conn->prepare('INSERT INTO detail_transaksi (id_transaksi,id_menu,jumlah) VALUES (?,?,?)');
          foreach(\$cart as \$i){
            \$sd->bind_param('iii',\$id,\$i['id'],\$i['qty']);
            if(!\$sd->execute()){echo 'FAIL: insert detail — '.\$conn->error;exit(1);}
          }
          // Verifikasi trigger
          \$sum=(int)\$conn->query(\"SELECT SUM(subtotal) FROM detail_transaksi WHERE id_transaksi=\$id\")->fetch_row()[0];
          if(\$sum!==\$subtotal){echo 'FAIL: trigger subtotal salah '.\$sum.'!='.\$subtotal;exit(1);}
          echo 'PASS: id='.\$id.', detail_sum via trigger='.\$sum.', total='.\$total;
          \$conn->query(\"DELETE FROM detail_transaksi WHERE id_transaksi=\$id\");
          \$conn->query(\"DELETE FROM transaksi WHERE id_transaksi=\$id\");
          "
          echo "✅ TRX-2 passed."

      # ── TRX-3: Cart kosong ditolak ───────────────────────────
      - name: "[TRX-3] Transaksi cart kosong ditolak"
        run: |
          php -r "
          \$cart=[]; \$nama=trim('CI Test');
          if(empty(\$cart)||empty(\$nama)){echo 'PASS: cart kosong → HTTP 400.';exit(0);}
          echo 'FAIL: seharusnya ditolak';exit(1);
          "
          echo "✅ TRX-3 passed."

      # ── TRX-4: Nama pelanggan kosong ─────────────────────────
      - name: "[TRX-4] Transaksi tanpa nama pelanggan ditolak"
        run: |
          php -r "
          \$cart=[['id'=>1,'price'=>25000,'qty'=>1]]; \$nama=trim('');
          if(empty(\$cart)||empty(\$nama)){echo 'PASS: nama kosong → ditolak.';exit(0);}
          echo 'FAIL: seharusnya ditolak';exit(1);
          "
          echo "✅ TRX-4 passed."

      # ── MENU-1: Tambah menu baru ─────────────────────────────
      - name: "[MENU-1] Tambah menu baru (admin/owner)"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->set_charset('utf8mb4');
          \$nm='CI Test Menu'; \$h=15000; \$kat=1; \$foto='ci.jpg';
          \$s=\$conn->prepare('INSERT INTO menu (nama_menu,harga,id_kategori,foto) VALUES (?,?,?,?)');
          \$s->bind_param('siis',\$nm,\$h,\$kat,\$foto);
          if(!\$s->execute()){echo 'FAIL: '.\$conn->error;exit(1);}
          \$id=\$conn->insert_id;
          \$v=\$conn->query(\"SELECT * FROM menu WHERE id_menu=\$id\")->fetch_assoc();
          if(\$v['nama_menu']!==\$nm){echo 'FAIL: nama tidak tersimpan';exit(1);}
          if((int)\$v['harga']!==\$h){echo 'FAIL: harga tidak tersimpan';exit(1);}
          echo 'PASS: menu id='.\$id.' berhasil ditambah.';
          \$conn->query(\"DELETE FROM menu WHERE id_menu=\$id\");
          "
          echo "✅ MENU-1 passed."

      # ── MENU-2: Edit menu ────────────────────────────────────
      - name: "[MENU-2] Edit menu (ubah nama & harga)"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->query(\"INSERT INTO menu (nama_menu,harga,id_kategori) VALUES ('Lama CI',10000,1)\");
          \$id=\$conn->insert_id;
          \$nb='Baru CI'; \$hb=20000;
          \$s=\$conn->prepare('UPDATE menu SET nama_menu=?,harga=? WHERE id_menu=?');
          \$s->bind_param('sii',\$nb,\$hb,\$id);
          if(!\$s->execute()){echo 'FAIL: UPDATE gagal';exit(1);}
          \$v=\$conn->query(\"SELECT * FROM menu WHERE id_menu=\$id\")->fetch_assoc();
          if(\$v['nama_menu']!==\$nb){echo 'FAIL: nama tidak terupdate';exit(1);}
          if((int)\$v['harga']!==\$hb){echo 'FAIL: harga tidak terupdate';exit(1);}
          echo 'PASS: menu id='.\$id.' diupdate → '.\$nb.' Rp'.\$hb;
          \$conn->query(\"DELETE FROM menu WHERE id_menu=\$id\");
          "
          echo "✅ MENU-2 passed."

      # ── MENU-3: Hapus menu yang direferensikan FK ─────────────
      - name: "[MENU-3] Hapus menu aktif ditolak oleh FK constraint"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$conn->query('SET FOREIGN_KEY_CHECKS=1');
          \$result=\$conn->query('DELETE FROM menu WHERE id_menu=6');
          if(\$result){echo 'FAIL: seharusnya ditolak FK';exit(1);}
          echo 'PASS: hapus menu direferensikan → ditolak ('.\$conn->error.')';
          "
          echo "✅ MENU-3 passed."

      # ── LAPORAN-1: Filter tanggal ─────────────────────────────
      - name: "[LAPORAN-1] Query laporan_penjualan filter tanggal"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$dari='2025-12-10'; \$sampai='2025-12-11';
          \$s=\$conn->prepare('SELECT * FROM laporan_penjualan WHERE DATE(tanggal) BETWEEN ? AND ? ORDER BY tanggal DESC');
          \$s->bind_param('ss',\$dari,\$sampai); \$s->execute();
          \$c=\$s->get_result()->num_rows;
          if(\$c===0){echo 'FAIL: laporan kosong untuk range tersebut';exit(1);}
          echo 'PASS: filter '.\$dari.' s/d '.\$sampai.' → '.\$c.' baris.';
          "
          echo "✅ LAPORAN-1 passed."

      # ── LAPORAN-2: Summary aggregate ─────────────────────────
      - name: "[LAPORAN-2] Summary total penjualan & menu terpopuler"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$total=(float)\$conn->query('SELECT SUM(total) FROM transaksi')->fetch_row()[0];
          \$count=(int)\$conn->query('SELECT COUNT(*) FROM transaksi')->fetch_row()[0];
          \$pop=\$conn->query('SELECT m.nama_menu,SUM(d.jumlah) as tot FROM detail_transaksi d JOIN menu m ON d.id_menu=m.id_menu GROUP BY m.id_menu ORDER BY tot DESC LIMIT 1')->fetch_assoc();
          if(\$total<=0){echo 'FAIL: total penjualan 0';exit(1);}
          if(\$count<=0){echo 'FAIL: jumlah transaksi 0';exit(1);}
          if(empty(\$pop)){echo 'FAIL: menu terpopuler tidak ditemukan';exit(1);}
          echo 'PASS: total=Rp'.number_format(\$total).', transaksi='.\$count.', populer='.\$pop['nama_menu'];
          "
          echo "✅ LAPORAN-2 passed."

      # ── LAPORAN-3: Summary per kategori (dashboard) ──────────
      - name: "[LAPORAN-3] Penjualan per kategori menu"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$res=\$conn->query('SELECT k.nama_kategori,SUM(d.subtotal) as total FROM detail_transaksi d JOIN menu m ON d.id_menu=m.id_menu JOIN kategori_menu k ON m.id_kategori=k.id_kategori GROUP BY k.id_kategori');
          if(!\$res||\$res->num_rows===0){echo 'FAIL: data kategori kosong';exit(1);}
          while(\$r=\$res->fetch_assoc()) echo 'PASS: '.\$r['nama_kategori'].'=Rp'.number_format(\$r['total']).PHP_EOL;
          "
          echo "✅ LAPORAN-3 passed."

      # ── STRUK-1: Data cetak struk valid ──────────────────────
      - name: "[STRUK-1] Cetak struk — JOIN transaksi + detail + menu"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$id=1;
          \$s=\$conn->prepare('SELECT * FROM transaksi WHERE id_transaksi=?');
          \$s->bind_param('i',\$id); \$s->execute();
          \$trx=\$s->get_result()->fetch_assoc();
          if(!\$trx){echo 'FAIL: transaksi id=1 tidak ada';exit(1);}
          \$s2=\$conn->prepare('SELECT d.*,m.nama_menu,m.harga FROM detail_transaksi d JOIN menu m ON d.id_menu=m.id_menu WHERE d.id_transaksi=?');
          \$s2->bind_param('i',\$id); \$s2->execute();
          \$items=\$s2->get_result();
          if(\$items->num_rows===0){echo 'FAIL: detail struk kosong';exit(1);}
          \$sum=0; while(\$r=\$items->fetch_assoc()) \$sum+=\$r['subtotal'];
          if(\$sum!==(int)\$trx['subtotal']){echo 'FAIL: sum detail '.\$sum.'!= subtotal '.\$trx['subtotal'];exit(1);}
          echo 'PASS: struk id='.\$id.', pelanggan='.\$trx['nama_pelanggan'].', total=Rp'.number_format(\$trx['total']);
          "
          echo "✅ STRUK-1 passed."

      # ── RIWAYAT-1: Ajax search ────────────────────────────────
      - name: "[RIWAYAT-1] Ajax search riwayat transaksi"
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          \$search=\$conn->real_escape_string('alya');
          \$result=\$conn->query(\"SELECT * FROM transaksi WHERE nama_pelanggan LIKE '%\$search%' OR id_transaksi LIKE '%\$search%' ORDER BY tanggal DESC LIMIT 50\");
          if(!\$result){echo 'FAIL: query error '.\$conn->error;exit(1);}
          \$c=\$result->num_rows;
          if(\$c===0){echo 'FAIL: tidak ada hasil untuk keyword alya';exit(1);}
          echo 'PASS: search \"alya\" → '.\$c.' transaksi.';
          "
          echo "✅ RIWAYAT-1 passed."

# ==============================================================
# JOB 4 — SECURITY AUDIT
# ==============================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - uses: actions/checkout@v4

      - name: "[SEC-1] MD5 password — tidak aman (warning)"
        run: |
          files=$(grep -rln "md5(" src/ --include="*.php" || true)
          if [ -n "$files" ]; then
            echo "⚠️  MD5 ditemukan di:"
            echo "$files" | sed 's/^/   /'
            echo "   → Rekomendasi: password_hash() + password_verify()"
          else
            echo "✅ Tidak ada MD5."
          fi

      - name: "[SEC-2] SQL Injection — raw query + input user (FAIL)"
        run: |
          risky=$(grep -rn --include="*.php" \
            -E 'query\s*\(\s*"[^"]*\$_(GET|POST|REQUEST)' src/ || true)
          if [ -n "$risky" ]; then
            echo "❌ Raw SQL + input user langsung:"
            echo "$risky"
            exit 1
          fi
          echo "✅ Tidak ditemukan SQL injection pattern."

      - name: "[SEC-3] XSS — echo input user tanpa sanitasi (warning)"
        run: |
          risky=$(grep -rn --include="*.php" -E 'echo\s+\$_(GET|POST|REQUEST)' src/ || true)
          [ -n "$risky" ] && { echo "⚠️  echo \$_USER langsung:"; echo "$risky"; echo "   → Gunakan htmlspecialchars()"; } \
            || echo "✅ Tidak ada echo \$_GET/POST langsung."

      - name: "[SEC-4] Session check di halaman terlindungi (warning)"
        run: |
          for f in $(find src/admin src/kasir src/owner -name "*.php" 2>/dev/null); do
            grep -q "SESSION" "$f" || echo "⚠️  Tidak ada session check: $f"
          done
          echo "✅ Audit session check selesai."

      - name: "[SEC-5] Raw DELETE tanpa prepared statement (warning)"
        run: |
          risky=$(grep -rn --include="*.php" \
            -E 'query\s*\(\s*"DELETE FROM users WHERE.+\$' src/ || true)
          [ -n "$risky" ] && { echo "⚠️  Raw DELETE:"; echo "$risky"; echo "   → Gunakan prepared statement."; } \
            || echo "✅ Tidak ada raw DELETE mencurigakan."

# ==============================================================
# JOB 5 — STRUKTUR FILE
# ==============================================================
  structure-check:
    name: 📁 Struktur File
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validasi semua file wajib ada
        run: |
          fail=0
          for f in \
            src/config.php src/login.php src/logout.php src/register.php \
            src/admin/dashboard.php src/admin/manajemen_menu.php \
            src/admin/manajemen_pengguna.php src/admin/manajemen_transaksi.php \
            src/admin/laporan_penjualan.php src/admin/profil.php \
            src/kasir/dashboard.php src/kasir/transaksi.php \
            src/kasir/proses_transaksi.php src/kasir/cetak_struk.php \
            src/kasir/riwayat.php src/kasir/laporan.php src/kasir/profil_kasir.php \
            src/owner/dashboard.php src/owner/manajemen_menu.php \
            src/owner/manajemen_pengguna.php src/owner/laporan_penjualan.php \
            src/owner/profil.php; do
            [ ! -f "$f" ] && { echo "❌ $f"; fail=1; } || echo "✅ $f"
          done
          [ $fail -eq 1 ] && exit 1

      - name: Validasi config.php menggunakan database easyresto
        run: |
          grep -q "easyresto" src/config.php \
            && echo "✅ config.php → easyresto" \
            || { echo "❌ database name bukan easyresto"; exit 1; }

      - name: Validasi file SQL ada di repo
        run: |
          sql=$(find . -name "*.sql" | grep -v ".git" | head -n 1)
          [ -z "$sql" ] && { echo "❌ File SQL tidak ditemukan."; exit 1; }
          echo "✅ SQL: $sql"

# ==============================================================
# JOB 6 — LAPORAN HASIL KE PR
# ==============================================================
