name: EasyResto CI Pipeline

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:

# ==============================================================
# JOB 1 — PHP SYNTAX CHECK
# ==============================================================

  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint semua file PHP
        run: |
          if [ ! -d "src" ]; then
            echo "⚠️ Folder src belum ada → SKIP"
            exit 0
          fi

          fail=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1)
            if echo "$out" | grep -qE "Parse error|Fatal error"; then
              echo "$f → $out"
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(find src/ -name "*.php" -print0)

          [ $fail -eq 1 ] && exit 1
          echo "✅ Semua file PHP valid"

# ==============================================================
# JOB 2 — DATABASE & SCHEMA VALIDATION (SKIP MODE)
# ==============================================================

  db-validate:
    name: Database Validation (Smart Skip)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easyresto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Tunggu MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && break
            sleep 2
          done

      - name: Import SQL (jika ada)
        run: |
          SQL=$(find . -name "*.sql" | grep -v ".git" | head -n 1)

          if [ -z "$SQL" ]; then
            echo "⚠️ File SQL belum ada → SKIP DB"
            exit 0
          fi

          mysql -h 127.0.0.1 -uroot -proot < "$SQL"
          echo "✅ Database diimport"

      - name: Validasi tabel
        run: |
          for tbl in users menu kategori_menu transaksi detail_transaksi; do
            res=$(mysql -h 127.0.0.1 -uroot -proot easyresto -se "SHOW TABLES LIKE '$tbl';")
            if [ -z "$res" ]; then
              echo "⚠️ $tbl belum ada"
            else
              echo "✅ $tbl"
            fi
          done

      - name: Validasi VIEW
        run: |
          res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SHOW FULL TABLES WHERE TABLE_TYPE='VIEW' AND Tables_in_easyresto='laporan_penjualan';")

          [ -z "$res" ] && echo "⚠️ VIEW belum ada" || echo "✅ VIEW OK"

      - name: Validasi TRIGGER
        run: |
          res=$(mysql -h 127.0.0.1 -uroot -proot easyresto \
            -se "SHOW TRIGGERS LIKE 'trg_subtotal_insert';")

          [ -z "$res" ] && echo "⚠️ TRIGGER belum ada" || echo "✅ TRIGGER OK"

# ==============================================================
# JOB 3 — FUNCTIONAL TEST (AUTO SKIP)
# ==============================================================

  functional-test:
    name: Functional Testing
    runs-on: ubuntu-latest
    needs: db-validate

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: easyresto
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli

      - name: Import SQL (jika ada)
        run: |
          SQL=$(find . -name "*.sql" | head -n 1)

          if [ -z "$SQL" ]; then
            echo "⚠️ Tidak ada SQL → SKIP TEST"
            exit 0
          fi

          mysql -h 127.0.0.1 -uroot -proot < "$SQL"

      - name: Test koneksi DB
        run: |
          php -r "
          \$conn = new mysqli('127.0.0.1','root','root','easyresto');
          if(\$conn->connect_error){
            echo 'FAIL koneksi';
            exit(1);
          }
          echo '✅ DB Connected';
          "

# ==============================================================
# JOB 4 — SECURITY AUDIT (NON-BLOCKING)
# ==============================================================

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - uses: actions/checkout@v4

      - name: Cek MD5
        run: |
          files=$(grep -rln "md5(" src/ || true)
          [ -n "$files" ] && echo "⚠️ MD5 ditemukan" || echo "✅ Aman"

      - name: Cek SQL Injection
        run: |
          risky=$(grep -rn '$_GET\|$_POST' src/ || true)
          [ -n "$risky" ] && echo "⚠️ Perlu validasi input" || echo "✅ Aman"

# ==============================================================
# JOB 5 — STRUKTUR FILE (SMART SKIP)
# ==============================================================

  structure-check:
    name: Struktur File
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cek folder src
        run: |
          [ ! -d "src" ] && echo "⚠️ src belum ada" && exit 0

      - name: Cek file penting
        run: |
          for f in src/config.php src/login.php src/register.php; do
            [ ! -f "$f" ] && echo "⚠️ $f belum ada" || echo "✅ $f"
          done

# ==============================================================
# JOB 6 — REPORT KE PR
# ==============================================================

  report:
    name: Laporan CI
    runs-on: ubuntu-latest
    needs: [php-lint, db-validate, functional-test, security-audit, structure-check]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ## 🍽️ EasyResto CI (Smart Mode)

            Semua validasi berjalan dengan sistem:
            - ✅ Ada → Dicek
            - ⚠️ Belum ada → Skip
            - ❌ Error → Gagal

            Cek tab **Actions** untuk detail lengkap.